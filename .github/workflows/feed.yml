name: Aggiorna feed auto

on:
  schedule:
    - cron: "17 19 * * *"
    - cron: "17 21 * * *"  # secondo tentativo
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: feed
  cancel-in-progress: false

jobs:
  feed:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Installa dipendenze
        run: pip install --quiet requests
      - name: Genera feed
        run: python genera_feed_auto.py
      - name: Salva i file
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898699+github-actions[bot]@users.noreply.github.com"
          git add feed_auto_google.xml feed_auto_facebook.xml esclusi.txt
          if git diff --cached --quiet; then
            echo "Nessuna modifica"
            exit 0
          fi
          git commit -q -m "Aggiornamento feed $(date -u '+%Y-%m-%d %H:%M') UTC"
          git pull -q --rebase origin "$GITHUB_REF_NAME"
          git push -q origin "HEAD:$GITHUB_REF_NAME"
